# Root Hydra config for the BreastMNIST VLM ablation pipeline.
# Override run group: run=breast_single, run=breast_debate_opinion, etc.
defaults:
  - _self_
  - run: breast_single
  - judges: medgemma

model:
  expert_model: "qwen2.5vl:7b"           # Qwen2.5-VL-7B-Instruct via Ollama
  expert_temperature: 0.7
  ollama_base_url: "http://localhost:11434"
  num_ctx: 8192                           # KV-cache context window; 12288 needs ~13 GiB; 8192 works with seed-filtered round-0 KG

# Stage A/B observation-conditioned KG retrieval.
# mode: constant_seed reproduces the original pipeline exactly (ablation baseline).
kg_retrieval:
  mode: "constant_seed"          # "observation_conditioned" | "constant_seed" (legacy)
  schema_path: "data/breast/schema.json"
  observation_dir: "data/breast/observations"
  observation_max_attempts: 3
  anchor_conf_threshold: 0.4
  max_per_category: 3
  max_stance_triples: 4
  lambda_mmr: 0.6
  hub_penalty_alpha: 0.5
  kg_token_budget: 200
  use_dense: true
  dense_model: "all-MiniLM-L6-v2"

data:
  num_samples: 50
  image_size: 224
  seed: 42
  split: "test"
  kg_path: "data/breast/knowledge_graph.json"
  definitions_path: "data/breast/definitions.json"
  indices_path: "data/breast/ablation_indices.json"
