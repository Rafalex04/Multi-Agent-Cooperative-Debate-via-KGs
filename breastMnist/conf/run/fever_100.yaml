# First 100 FEVER claims. Requires live Ollama/vLLM and network access.
max_rounds: 5
num_claims: 100
retriever_k_hops: 2
retriever_max_triples: 50
merger_score_floor: 0.3
use_stub_data: false
merger: rule_based          # rule_based | naive_union | random
mode: debate                # debate | single_expert
random_merge_keep_prob: 0.5
